name: Temporary MUTE art-workbench
on:
  push:
    branches: [art/mute-hair-repair-20261030]
    paths:
      - '.github/scripts/repair_mute.py'
      - '.github/workflows/mute-workbench.yml'
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster tools
        run: python -m pip install pillow numpy
      - name: Repair existing illustrated hair and verify face
        run: python .github/scripts/repair_mute.py
      - name: Produce native-scale stage comparison
        run: |
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageChops
          im=Image.open('assets/characters/mute.webp').convert('RGBA')
          stage=Image.open('assets/stages/mute.webp').convert('RGBA')
          sprite=im.resize((153,184),Image.Resampling.LANCZOS)
          layer=Image.new('RGBA',stage.size)
          layer.alpha_composite(sprite,(759,201))
          mask=Image.new('L',stage.size)
          ImageDraw.Draw(mask).rectangle((0,0,1672,384),fill=255)
          layer.putalpha(ImageChops.multiply(layer.getchannel('A'),mask))
          stage.alpha_composite(layer)
          stage.save('mute-stage-preview.png')
          PY
      - name: Commit repaired sprite to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/characters/mute.webp
          git diff --cached --quiet || (git commit -m "fix(art): restore MUTE hair volume and alpha cutout" && git push)
      - uses: actions/upload-artifact@v4
        with:
          name: mute-repaired-review
          path: |
            assets/characters/mute.webp
            mute-stage-preview.png
          if-no-files-found: error
