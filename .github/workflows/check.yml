name: Physics and browser verification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS syntax
        run: |
          node --check src/physics.js
          node --check src/game.js
          node --check src/mamouda-stage.js
          node --check src/mamouda-painted-stage.js
          node --check src/mamouda-illustrated.js
          node --check src/controls.js
          node --check src/roster.js
          node --check src/ai-profiles.js
          node --check src/campaign.js
          node --check src/synthpuck-sprite-art.js
          node --check src/hal-eye.js
          node --check src/synthpuck.js
          node --check tests/synthpuck-browser.mjs
          node --check tests/synthpuck.test.mjs
      - name: Run simulation tests
        run: node --test tests/*.test.mjs
      - name: Install headless Chromium driver
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Smoke test 3D game startup
        run: node tests/browser-smoke.mjs
      - name: Smoke test full Synthpuck Arcade and Training
        run: node tests/synthpuck-browser.mjs
      - name: Upload Mamouda 2.5D screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mamouda-preview
          path: |
            mamouda-preview.png
            mamouda-painted-preview.png
            mamouda-final-preview.png
            synthpuck-arcade-preview.png
            synthpuck-pause-levels-preview.png
            synthpuck-training-preview.png
            synthpuck-studio-preview.png
            synthpuck-title-preview.png
            synthpuck-character-select-preview.png
            synthpuck-landscape-preview.png
            synthpuck-wide-hud-preview.png
            synthpuck-opponent-*-preview.png
          if-no-files-found: ignore
