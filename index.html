<!doctype html><html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#080c18"/><title>SYNTHPUCK — PiperadeGames</title><link rel="stylesheet" href="./src/synthpuck.css?v=ai-smash-20261101-8"/><link rel="stylesheet" href="./src/player-account.css?v=accounts-20261101"/><link rel="stylesheet" href="./src/online-menu.css?v=online-20261101-3"/></head>
<body><main id="app">
  <div id="scene"><canvas id="backdrop" aria-hidden="true"></canvas><canvas id="arena" aria-label="Arène de Synthpuck. Déplace la raquette avec la souris ou le doigt."></canvas><div id="fighterName" hidden></div></div>
